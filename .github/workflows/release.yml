name: Release DLC

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: 打包 DLC zip（git archive，绕开 checkout 中文名破坏）
        shell: bash
        run: |
          git config --global core.quotepath false
          python3 - <<'EOF'
          import subprocess
          names = subprocess.run(['git', 'ls-tree', '--name-only', 'HEAD'],
                                 capture_output=True, text=True).stdout.splitlines()
          for d in names:
              if d.startswith('DLC') and '/' not in d:
                  out = d + '.zip'
                  subprocess.run(['git', 'archive', '--format=zip', '-o', out, 'HEAD', d], check=True)
                  print('packed:', out)
          EOF
          ls -la *.zip

      - name: 上传 Release
        uses: softprops/action-gh-release@v2
        with:
          files: "DLC*.zip"
          generate_release_notes: true
          overwrite: true
