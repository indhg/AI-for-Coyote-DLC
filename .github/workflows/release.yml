name: Release DLC

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: 打包 DLC zip（git archive，绕开 checkout 中文名破坏）
        shell: bash
        run: |
          git config --global core.quotepath false
          python3 - <<'EOF'
          import subprocess
          names = subprocess.run(['git', 'ls-tree', '--name-only', 'HEAD'],
                                 capture_output=True, text=True).stdout.splitlines()
          diag = []
          diag.append('ls-tree names: ' + repr(names))
          diag.append('cwd: ' + repr(subprocess.run(['ls','-la'],capture_output=True,text=True).stdout))
          for d in names:
              if d.startswith('DLC') and '/' not in d:
                  out = d + '.zip'
                  subprocess.run(['git', 'archive', '--format=zip', '-o', out, 'HEAD', d], check=True)
                  diag.append('packed: ' + repr(out))
          diag.append('zip files: ' + repr(subprocess.run(['ls','-la','*.zip'],capture_output=True,text=True,shell=True).stdout))
          open('notes.txt','w',encoding='utf-8').write('\n'.join(diag))
          EOF

      - name: 创建 Release 并上传（python urllib，保 UTF-8 文件名）
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os, urllib.error, urllib.parse, urllib.request
          token = os.environ['GH_TOKEN']
          tag = os.environ['GITHUB_REF_NAME']
          repo = 'indhg/AI-for-Coyote-DLC'
          h = {'Authorization': 'token ' + token, 'User-Agent': 'ci',
               'Accept': 'application/vnd.github+json'}
          def api(method, url, data=None, ctype=None):
              hh = dict(h)
              if ctype:
                  hh['Content-Type'] = ctype
              req = urllib.request.Request(url, data=data, headers=hh, method=method)
              return urllib.request.urlopen(req)
          try:
              body = json.dumps({'tag_name': tag, 'name': tag}).encode()
              rel = json.loads(api('POST', f'https://api.github.com/repos/{repo}/releases',
                                   body, 'application/json').read())
          except urllib.error.HTTPError as e:
              if e.code == 422:
                  rel = json.loads(api('GET', f'https://api.github.com/repos/{repo}/releases/tags/{tag}').read())
              else:
                  raise
          diag = ['listdir: ' + repr(sorted(os.listdir('.')))]
          for f in sorted(os.listdir('.')):
              if f.startswith('DLC') and f.endswith('.zip'):
                  name = urllib.parse.quote(f)
                  url = f'https://uploads.github.com/repos/{repo}/releases/{rel["id"]}/assets?name={name}'
                  try:
                      with api('POST', url, open(f, 'rb').read(), 'application/zip') as r:
                          resp = json.loads(r.read())
                          diag.append('upload ok: ' + repr(f) + ' -> server name: ' + repr(resp.get('name')))
                  except urllib.error.HTTPError as e:
                      diag.append('skip (asset exists?): ' + repr(f) + ' code ' + str(e.code))
          patch = json.dumps({'body': '\n'.join(diag)}).encode()
          api('PATCH', f'https://api.github.com/repos/{repo}/releases/{rel["id"]}',
              patch, 'application/json')
          EOF
